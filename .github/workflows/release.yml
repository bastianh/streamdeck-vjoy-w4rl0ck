# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Releases

permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4    
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal
      - name: Create output directory
        run: |
          mkdir release
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Stream Deck CLI
        run: npm install -g @elgato/cli
      - name: Pack plugin
        run: streamdeck pack streamdeck-vjoy-w4rl0ck\bin\Debug\dev.w4rl0ck.streamdeck.vjoy.sdPlugin -o release --force --no-update-check
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release\\dev.w4rl0ck.streamdeck.vjoy.streamDeckPlugin